[package]
name = "jpgfromraw-lib"
edition = "2024"
version = "0.7.2"
authors = ["Chris Down <chris@chrisdown.name>"]
description = "Library fork of jpgfromraw: embedded JPEG extraction from RAW files"
repository = "https://github.com/ioma8/jpgfromrawlib"
readme = "README.md"
keywords = ["raw", "camera", "extract", "jpeg", "jpg"]
categories = ["command-line-utilities"]
license = "MIT"
rust-version = "1.96"
exclude = [
    "bench",
    "bench_transfers",
    "docs/",
    "perf_artifacts/",
    "test_images/",
    "wip/",
]

[lib]
path = "src/lib.rs"

[features]
default = []
cli = ["dep:clap", "dep:indicatif"]
tiff-preview = ["dep:image", "image/jpeg"]
raster-fallback = ["dep:image", "image/bmp", "image/gif", "image/hdr", "image/ico", "image/jpeg", "image/png", "image/pnm", "image/qoi", "image/tga", "image/tiff", "image/webp"]
generic-raster = ["raster-fallback", "image/avif", "image/avif-native", "image/dds", "image/exr"]
dcraw-fallback = ["dep:image", "dep:tempfile", "image/jpeg", "image/pnm"]
gpr-fallback = ["dep:tempfile"]
full = ["generic-raster", "tiff-preview", "dcraw-fallback", "gpr-fallback"]

[dependencies]
anyhow = "1.0.102"
byteorder = "1.5.0"
image = { version = "0.25.10", optional = true, default-features = false }
indicatif = { version = "0.18.4", optional = true }
memchr = "2.8.1"
memmap2 = "0.9.10"
tempfile = { version = "3.23.0", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_Threading"] }

[dependencies.clap]
version = "4.6.1"
optional = true
features = ["std", "derive", "help"]
default-features = false

[dependencies.tokio]
version = "1.52.3"
features = ["fs", "io-util", "macros", "rt-multi-thread", "sync"]
default-features = false

[dev-dependencies]
trybuild = "1.0.114"
tempfile = "3.23.0"
jpeg-decoder = "0.3.1"

[[bin]]
name = "jpgfromraw"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "perf_probe"
path = "src/bin/perf_probe.rs"
required-features = ["cli"]
